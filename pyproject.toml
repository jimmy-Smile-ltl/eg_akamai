[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekit"
version = "0.1.0"
description = "Detect and solve Akamai interstitial challenges, with offline-tested judgments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JimmySmile" }]
keywords = ["akamai", "bot-manager", "interstitial", "bm-verify", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl_cffi>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jimmy-Smile-ltl/eg_akamai"

[project.scripts]
gatekit = "gatekit.cli:main"

[tool.setuptools]
packages = ["gatekit"]
